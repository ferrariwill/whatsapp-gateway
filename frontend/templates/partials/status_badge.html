{{define "status_badge.html"}}
{{if .IsSuspendedSpam}}
<span class="inline-flex items-center gap-1.5 rounded-full bg-red-500/15 px-2.5 py-1 text-xs font-semibold text-red-300 ring-1 ring-red-500/30" title="SUSPENDED_SPAM">
  <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
  </svg>
  <span>Suspenso (spam)</span>
</span>
{{else if eq .Status "ACTIVE"}}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-2.5 py-1 text-xs font-medium text-emerald-300 ring-1 ring-emerald-500/20" title="ACTIVE">
  <svg class="h-3.5 w-3.5 shrink-0" fill="currentColor" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3"/></svg>
  <span>Ativo</span>
</span>
{{else}}
<span class="inline-flex items-center rounded-full bg-slate-500/10 px-2.5 py-1 text-xs font-medium text-slate-300 ring-1 ring-slate-500/20" title="{{.Status}}">{{.Status}}</span>
{{end}}
{{end}}
