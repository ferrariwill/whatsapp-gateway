{{define "channel_row.html"}}
<tr id="channel-row-{{.ChannelID}}" class="{{if .IsSuspendedSpam}}bg-red-950/20{{end}}">
  <td class="px-4 py-3 text-slate-300">{{.SystemName}}</td>
  <td class="px-4 py-3 font-medium text-white">{{.ChannelLabel}}</td>
  <td class="px-4 py-3 font-mono text-slate-300">{{.ExternalClientID}}</td>
  <td class="px-4 py-3 font-mono text-slate-200">{{.WhatsAppPhoneNumber}}</td>
  <td class="px-4 py-3 font-mono text-xs text-emerald-300">{{.PhoneNumberID}}</td>
  <td class="px-4 py-3">
    {{if .IsSuspendedSpam}}
    <span class="inline-flex items-center rounded-full bg-red-500/15 px-2.5 py-1 text-xs font-semibold text-red-300 ring-1 ring-red-500/30">SUSPENDED_SPAM</span>
    {{else}}
    <span class="inline-flex items-center rounded-full bg-emerald-500/10 px-2.5 py-1 text-xs font-medium text-emerald-300 ring-1 ring-emerald-500/20">{{.Status}}</span>
    {{end}}
  </td>
  <td class="px-4 py-3 text-slate-400">{{.CreatedAt}}</td>
  <td class="px-4 py-3">
    <div class="flex flex-wrap gap-2">
      {{if .IsSuspendedSpam}}
      <button
        type="button"
        class="inline-flex items-center rounded-lg border border-amber-500/40 bg-amber-500/10 px-2.5 py-1 text-xs font-semibold text-amber-200 transition hover:bg-amber-500/20"
        hx-post="/admin/clients/{{.ChannelID}}/unblock"
        hx-target="#channel-row-{{.ChannelID}}"
        hx-swap="outerHTML"
        hx-confirm="Desbloquear este cliente e limpar a proteção anti-spam em memória?"
      >
        🔓 Desbloquear
      </button>
      {{end}}
      <button
        type="button"
        class="rounded-lg border border-slate-700 px-2.5 py-1 text-xs text-slate-300 hover:bg-slate-800"
        data-channel-id="{{.ChannelID}}"
        data-system-id="{{.SystemID}}"
        data-salon-name="{{.ChannelLabel}}"
        data-external-client-id="{{.ExternalClientID}}"
        data-whatsapp-phone="{{.WhatsAppPhoneNumber}}"
        data-phone-number-id="{{.PhoneNumberID}}"
        onclick="openEditChannelModal(this)"
      >
        Editar
      </button>
      <button
        type="button"
        class="rounded-lg border border-red-500/30 px-2.5 py-1 text-xs text-red-300 hover:bg-red-500/10"
        hx-post="/admin/channels/{{.ChannelID}}/delete"
        hx-swap="none"
        hx-confirm="Excluir o canal do cliente {{.ExternalClientID}}?"
        hx-on::after-request="removeChannelRow(event, 'channel-row-{{.ChannelID}}')"
      >
        Excluir
      </button>
    </div>
  </td>
</tr>
{{end}}
