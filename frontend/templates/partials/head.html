{{define "head.html"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}}{{else}}WhatsApp Gateway{{end}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  .htmx-indicator { display: none; }
  .htmx-request .htmx-indicator { display: block; }
  .htmx-request.htmx-indicator { display: block; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }
</style>
<script>
  let activeModalId = null;
  let lastFocusEl = null;

  function showToast(message, kind) {
    const region = document.getElementById('admin-toast');
    if (!region) return;
    const el = document.createElement('div');
    const isError = kind === 'error';
    el.setAttribute('role', 'status');
    el.className = isError
      ? 'pointer-events-auto rounded-xl border border-red-500/40 bg-red-950/95 px-4 py-3 text-sm text-red-100 shadow-lg'
      : 'pointer-events-auto rounded-xl border border-emerald-500/40 bg-emerald-950/95 px-4 py-3 text-sm text-emerald-100 shadow-lg';
    el.textContent = message;
    region.replaceChildren(el);
    window.clearTimeout(region._toastTimer);
    region._toastTimer = window.setTimeout(function () {
      if (el.parentNode === region) el.remove();
    }, 3500);
  }

  function announceCopy(message) {
    const live = document.getElementById('copy-announce');
    if (live) {
      live.textContent = '';
      window.setTimeout(function () { live.textContent = message; }, 10);
    }
    showToast(message, 'success');
  }

  function copyToClipboard(button) {
    const value = button.getAttribute('data-copy');
    if (!value) return;
    navigator.clipboard.writeText(value).then(function () {
      const original = button.textContent;
      button.textContent = 'Copiado!';
      button.classList.add('bg-emerald-600');
      announceCopy('Copiado');
      setTimeout(function () {
        button.textContent = original;
        button.classList.remove('bg-emerald-600');
      }, 1500);
    }).catch(function () {
      showToast('Não foi possível copiar.', 'error');
    });
  }

  function ensureTableEmptyState(tbodyId, emptyHtml) {
    const tbody = document.getElementById(tbodyId);
    if (tbody && !tbody.querySelector('tr')) {
      tbody.innerHTML = emptyHtml;
    }
  }

  const channelsEmptyRowHtml = '<tr id="channels-empty-row"><td colspan="8" class="px-4 py-8 text-center text-slate-500">Nenhum canal vinculado ainda.</td></tr>';
  const connectionsEmptyRowHtml = '<tr id="connections-empty-row"><td colspan="10" class="px-4 py-8 text-center text-slate-500">Nenhuma conexão cadastrada. Crie a primeira para habilitar POST /send-notification.</td></tr>';
  const systemsEmptyRowHtml = '<tr id="systems-empty-row"><td colspan="6" class="px-4 py-8 text-center text-slate-500">Nenhuma aplicação cadastrada. Crie a primeira antes de vincular canais.</td></tr>';

  function removeConnectionRow(event, rowId) {
    removeRowAfterDelete(event, rowId, 'connections-tbody', connectionsEmptyRowHtml);
  }

  function removeChannelRow(event, rowId) {
    removeRowAfterDelete(event, rowId, 'channels-tbody', channelsEmptyRowHtml);
  }

  function removeSystemRow(event, rowId) {
    removeRowAfterDelete(event, rowId, 'systems-tbody', systemsEmptyRowHtml);
  }

  function removeRowAfterDelete(event, rowId, tbodyId, emptyHtml) {
    if (!event.detail.successful) {
      showToast('Não foi possível excluir. Tente novamente.', 'error');
      return;
    }
    document.getElementById(rowId)?.remove();
    ensureTableEmptyState(tbodyId, emptyHtml);
    showToast('Excluído com sucesso.', 'success');
  }

  function clearModalFeedback() {
    document.getElementById('channel-form-feedback')?.replaceChildren();
    document.getElementById('system-form-feedback')?.replaceChildren();
    document.getElementById('connection-form-feedback')?.replaceChildren();
    document.getElementById('edit-system-form-feedback')?.replaceChildren();
    document.getElementById('edit-channel-form-feedback')?.replaceChildren();
    document.getElementById('edit-connection-form-feedback')?.replaceChildren();
  }

  function getFocusable(container) {
    return Array.prototype.slice.call(container.querySelectorAll(
      'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
    ));
  }

  function onModalKeydown(e) {
    if (!activeModalId) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeModal(activeModalId);
      return;
    }
    if (e.key !== 'Tab') return;
    const modal = document.getElementById(activeModalId);
    if (!modal || modal.classList.contains('hidden')) return;
    const panel = modal.querySelector('[data-modal-panel]') || modal;
    const focusable = getFocusable(panel);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function openModal(id) {
    const modal = document.getElementById(id);
    if (!modal) return;
    if (activeModalId && activeModalId !== id) {
      closeModal(activeModalId);
    }
    lastFocusEl = document.activeElement;
    activeModalId = id;
    clearModalFeedback();
    modal.classList.remove('hidden');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('overflow-hidden');
    document.addEventListener('keydown', onModalKeydown);
    const panel = modal.querySelector('[data-modal-panel]') || modal;
    const focusTarget = panel.querySelector('input:not([type="hidden"]), select, textarea')
      || panel.querySelector('button:not([data-modal-close])')
      || panel;
    window.setTimeout(function () {
      if (focusTarget && typeof focusTarget.focus === 'function') focusTarget.focus();
    }, 0);
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (!modal) return;
    modal.classList.add('hidden');
    modal.setAttribute('aria-hidden', 'true');
    if (activeModalId === id) {
      activeModalId = null;
      document.body.classList.remove('overflow-hidden');
      document.removeEventListener('keydown', onModalKeydown);
      if (lastFocusEl && typeof lastFocusEl.focus === 'function') {
        lastFocusEl.focus();
      }
      lastFocusEl = null;
    }
  }

  document.addEventListener('click', function (e) {
    if (!activeModalId) return;
    const modal = document.getElementById(activeModalId);
    if (modal && e.target === modal) {
      closeModal(activeModalId);
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    document.body.addEventListener('htmx:responseError', function () {
      showToast('Falha na operação. Tente novamente.', 'error');
    });
    document.body.addEventListener('htmx:sendError', function () {
      showToast('Falha de rede. Verifique a conexão.', 'error');
    });
  });

  function openEditSystemModal(button) {
    const form = document.getElementById('edit-system-form');
    form.action = '/admin/systems/' + button.dataset.systemId;
    form.setAttribute('hx-post', form.action);
    form.setAttribute('hx-target', '#system-row-' + button.dataset.systemId);
    form.querySelector('[name=name]').value = button.dataset.systemName || '';
    form.querySelector('[name=slug]').value = button.dataset.systemSlug || '';
    form.querySelector('[name=webhook_url]').value = button.dataset.systemWebhook || '';
    document.getElementById('edit-system-form-feedback')?.replaceChildren();
    htmx.process(form);
    openModal('edit-system-modal');
  }

  function openEditChannelModal(button) {
    const form = document.getElementById('edit-channel-form');
    form.action = '/admin/channels/' + button.dataset.channelId;
    form.setAttribute('hx-post', form.action);
    form.setAttribute('hx-target', '#channel-row-' + button.dataset.channelId);
    form.querySelector('[name=system_id]').value = button.dataset.systemId || '';
    form.querySelector('[name=salon_name]').value = button.dataset.salonName || '';
    form.querySelector('[name=external_client_id]').value = button.dataset.externalClientId || '';
    form.querySelector('[name=whatsapp_phone_number]').value = button.dataset.whatsappPhone || '';
    form.querySelector('[name=phone_number_id]').value = button.dataset.phoneNumberId || '';
    document.getElementById('edit-channel-form-feedback')?.replaceChildren();
    htmx.process(form);
    openModal('edit-channel-modal');
  }

  function openEditConnectionModal(button) {
    const form = document.getElementById('edit-connection-form');
    form.action = '/admin/connections/' + button.dataset.connectionId;
    form.setAttribute('hx-post', form.action);
    form.setAttribute('hx-target', '#connection-row-' + button.dataset.connectionId);
    form.querySelector('[name=system_id]').value = button.dataset.systemId || '';
    form.querySelector('[name=tenant_id]').value = button.dataset.tenantId || '';
    form.querySelector('[name=waba_id]').value = button.dataset.wabaId || '';
    form.querySelector('[name=phone_number_id]').value = button.dataset.phoneNumberId || '';
    form.querySelector('[name=access_token]').value = '';
    form.querySelector('[name=webhook_url]').value = button.dataset.webhookUrl || '';
    form.querySelector('[name=whatsapp_phone_number]').value = button.dataset.whatsappPhone || '';
    document.getElementById('edit-connection-form-feedback')?.replaceChildren();
    htmx.process(form);
    openModal('edit-connection-modal');
  }
</script>
{{end}}
