{{define "embedded_signup_result.html"}}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  {{template "head.html" .}}
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="flex min-h-full items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl {{if .Success}}bg-emerald-500/10 ring-1 ring-emerald-500/30{{else}}bg-red-500/10 ring-1 ring-red-500/30{{end}}">
          {{if .Success}}
          <svg class="h-7 w-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{else}}
          <svg class="h-7 w-7 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
          {{end}}
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-white">
          {{if .Success}}Conexão WhatsApp{{else}}Falha na conexão WhatsApp{{end}}
        </h1>
        <p class="mt-2 text-sm text-slate-400">WhatsApp Gateway · Embedded Signup</p>
      </div>

      <div class="rounded-2xl border {{if .Success}}border-emerald-500/30{{else}}border-red-500/30{{end}} bg-slate-900/80 p-6 shadow-2xl shadow-black/40 backdrop-blur sm:p-8">
        <p
          class="text-sm {{if .Success}}text-emerald-200{{else}}text-red-200{{end}}"
          role="{{if .Success}}status{{else}}alert{{end}}"
          aria-live="polite"
        >
          {{.Message}}
        </p>
        {{if .Detail}}
        <p class="mt-3 text-sm text-slate-400">{{.Detail}}</p>
        {{end}}

        <div class="mt-8 flex flex-col gap-3">
          <a
            href="/dashboard"
            class="inline-flex min-h-[44px] w-full items-center justify-center rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
          >
            Abrir painel
          </a>
          <a
            href="/login"
            class="inline-flex min-h-[44px] w-full items-center justify-center rounded-xl border border-slate-700 px-4 py-3 text-sm text-slate-300 transition hover:border-slate-600 hover:bg-slate-800 hover:text-white"
          >
            Ir para login
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
{{end}}
