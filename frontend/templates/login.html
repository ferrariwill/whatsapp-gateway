{{define "login.html"}}
{{template "layout.html" .}}
{{end}}

{{define "content"}}
<div class="flex min-h-full items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/10 ring-1 ring-emerald-500/30">
        <svg class="h-7 w-7 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight text-white">WhatsApp Gateway</h1>
      <p class="mt-2 text-sm text-slate-400">Painel multi-tenant de agendamentos</p>
    </div>

    <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl shadow-black/40 backdrop-blur">
      {{if .Error}}
      <div class="mb-6 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
        {{.Error}}
      </div>
      {{end}}

      <form
        hx-post="/login"
        hx-target="body"
        hx-swap="outerHTML"
        class="space-y-5"
      >
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-slate-300">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none ring-emerald-500/0 transition focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/20"
            placeholder="admin@empresa.com"
          >
        </div>

        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-slate-300">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none ring-emerald-500/0 transition focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/20"
            placeholder="••••••••"
          >
        </div>

        <button
          type="submit"
          class="flex w-full items-center justify-center rounded-xl bg-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/40"
        >
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{{end}}
